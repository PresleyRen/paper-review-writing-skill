name: Validate paper writing skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check project tools and installation
        run: python3 tools/test_paper_tools.py
      - name: Check evidence candidate extraction
        run: python3 .agents/skills/paper-evidence-audit/scripts/test_extract_audit_items.py
      - name: Check target-journal search
        run: python3 .agents/skills/paper-draft/scripts/test_find_venue_papers.py
